[project]
name = "industrial-inspection"
version = "0.1.0"
description = "Production-oriented visual anomaly inspection on MVTec AD 2: fixed-miss-rate evaluation, robustness, and edge latency."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "anomalib>=2.0",
    "numpy",
    "pandas<3",  # anomalib 2.7 breaks on pandas 3 string dtype (None mask_path -> NaN)
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "huggingface-hub",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

# RTX 3050 (Ampere, sm_86), driver 560.94 -> max CUDA 12.6. cu128 requires a newer driver.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
